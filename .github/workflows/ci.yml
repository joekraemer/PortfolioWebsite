name: CI

# Check pull requests before they merge. deploy.yml only runs on pushes to
# main, so without this a broken change is found after it ships (#52).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR replaces its older, still-running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Fails on high or critical advisories in packages that ship to the
      # browser; dev-only tooling is left out.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
