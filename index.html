    <!-- Link previews. No static og:url or rel="canonical" on purpose: every
         route is served this same head (scripts/spa-routes.mjs), so a static
         canonical would mark every page as a duplicate of the home page. -->

    <meta property="og:site_name" content="Joe Kraemer" />
    <meta property="og:title" content="Joe Kraemer" />
    <meta property="og:description" content="Joe Kraemer: software engineer at Amazon Project Kuiper working on embedded and systems software, hardware-in-the-loop testing and satellite ground links." />

    />
    <link rel="manifest" href="/manifest.json" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      // Decodes the "/?/" redirect produced by 404.html back into a normal
      // SPA route before the app's bundle loads, so deep links and refreshes
      // on GitHub Pages resolve correctly.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <title>Joe Kraemer</title>
